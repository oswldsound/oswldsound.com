<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="OS — close your eyes.">
<title>OS</title>
<style>
:root{color-scheme:dark;--bg:#000;--text:#f5f5f5;--muted:#929292;--line:#292929}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;transition:color .15s ease}
a:hover{color:#999}
main{width:min(100% - 48px,640px);margin:0 auto;padding:104px 0 112px}
h1,h2,p{margin:0}
h1{font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-.045em}
.tagline{margin-top:7px;color:var(--muted);font-size:15px;line-height:1.5}
section{margin-top:64px}
h2{font-size:15px;line-height:1.5;font-weight:600;margin-bottom:14px}
ul{list-style:none;padding:0;margin:0}
li{display:flex;justify-content:space-between;align-items:baseline;gap:24px;padding:6px 0;line-height:1.55}
@media(max-width:600px){main{width:calc(100% - 40px);padding:72px 0 80px}section{margin-top:54px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1>OS</h1>
    <p class="tagline">close your eyes</p>
  </header>

  <section aria-labelledby="music-title">
    <h2 id="music-title">Music</h2>
    <ul>
      <li><a href="./beats/">Beats</a></li>
    </ul>
  </section>

  <section aria-labelledby="contact-title">
    <h2 id="contact-title">Contact</h2>
    <ul>
      <li><a href="mailto:os@oswldsound.com">Email</a></li>
      <li><a href="https://www.instagram.com/oswldsound/" target="_blank" rel="noopener noreferrer">Instagram</a></li>
      <li><a href="https://www.tiktok.com/@oswldsound" target="_blank" rel="noopener noreferrer">TikTok</a></li>
      <li><a href="https://www.youtube.com/@oswldsound" target="_blank" rel="noopener noreferrer">YouTube</a></li>
    </ul>
  </section>
</main>
</body>
</html>
