<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="OS — close your eyes.">
<title>OS</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;650;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--text:#f5f5f5;--muted:#929292;--line:#292929;--link:#f5f5f5}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none;transition:color .15s ease}
a:hover{color:#aaa}
main{width:min(100% - 48px,640px);margin:0 auto;padding:104px 0 112px}
h1,h2,p{margin:0}
h1{font-size:30px;line-height:1.35;font-weight:600;letter-spacing:-.04em}
.brand-link{color:var(--text)}
.tagline{margin-top:16px;color:#b5b5b5;max-width:590px;line-height:1.75}
section{margin-top:76px}
.section-title{font-size:15px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:8px 0}
.list li a{display:block;width:100%}
section .list li a{flex:1;padding:8px 12px;margin:-8px -12px;transition:color .12s ease}
section .list li a:hover{color:#d8d8d8}
.beats-link{display:block!important;padding:0!important}
.beats-link a{display:block;width:100%;padding:8px 0;color:var(--link);transition:background-color .15s ease;border-radius:2px}
.beats-title{display:inline-block;font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:4px}
.beats-description{display:block;color:#929292;font-size:15px;line-height:1.65;margin-top:2px}
.beats-link a:hover{background-color:rgba(255,255,255,.035)}
.beats-link a:focus-visible{outline:1px solid #929292;outline-offset:2px}
@media(max-width:600px){main{width:calc(100% - 40px);padding:72px 0 80px}section{margin-top:62px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1>OS</h1>
    <p class="tagline">close your eyes</p>
  </header>

  <nav aria-label="Music" style="margin-top:76px">
    <ul class="list">
      <li class="beats-link"><a href="/preview/beats/"><span class="beats-title">Beats</span><span class="beats-description">Instrumentals for licensing.</span></a></li>
    </ul>
  </nav>

  <section aria-labelledby="contact-title">
    <h2 class="section-title" id="contact-title">Contact</h2>
    <ul class="list">
      <li><a href="mailto:os@oswldsound.com">Email</a></li>
      <li><a href="https://www.instagram.com/oswldsound/" target="_blank" rel="noopener noreferrer">Instagram</a></li>
      <li><a href="https://www.tiktok.com/@oswldsound" target="_blank" rel="noopener noreferrer">TikTok</a></li>
      <li><a href="https://www.youtube.com/@oswldsound" target="_blank" rel="noopener noreferrer">YouTube</a></li>
    </ul>
  </section>
</main>
</body>
</html>
